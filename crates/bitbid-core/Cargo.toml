[package]
name = "bitbid-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Shared native/WASM payload protocol, cryptography and registry codecs for Bitbid"

[dependencies]
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
bip32 = { version = "=0.5.3", default-features = false, features = ["secp256k1", "std"] }
bip39 = { version = "=2.2.2", default-features = false, features = ["std", "zeroize"] }
aes-gcm = "0.10.3"
base64 = "0.22.1"
getrandom = "0.2"
hkdf = "0.12.4"
k256 = { version = "0.13.4", features = ["ecdh", "arithmetic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
thiserror = "2"
zeroize = "1.8.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
