[package]
name = "bitbid-webapp-core"
description = "Pure, host-testable core for the bitbid web console: seal/unseal crypto and BsecSecretRegistry JSON-RPC decoding."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bitbid-core = { path = "../../../bitsec/crates/bitbid-core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
team_getrandom = { package = "getrandom", version = "=0.4.3", features = ["wasm_js"] }

[dev-dependencies]
hex = "=0.4.3"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
