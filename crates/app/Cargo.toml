[package]
name = "bitbid-webapp"
description = "Yew client-side web console for bitbid: seal/unseal, wallet connect, registry explorer."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bitbid-webapp-core = { path = "../core" }
yew = { version = "0.23", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
serde_json = { workspace = true }

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
]
