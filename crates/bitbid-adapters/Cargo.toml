[package]
name = "bitbid-adapters"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Native host adapters for Bitbid's shared core"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bitbid-core = { path = "../bitbid-core" }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.19.0"
